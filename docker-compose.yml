services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: galpao
      MYSQL_USER: galpao
      MYSQL_PASSWORD: galpao
    ports:
      - "3307:3306"   # MySQL Workbench / DBeaver: localhost:3307
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: mysql+pymysql://galpao:galpao@db:3306/galpao?charset=utf8mb4
      MQTT_HOST: mosquitto
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app
      - ./dashboard:/app/dashboard

  simulador:
    build: ./simulador
    depends_on:
      - mosquitto
      - api
    environment:
      MQTT_HOST: mosquitto
      ROBO_IDS: R01,R02,R03
      TICK: "0.4"

volumes:
  mysqldata:
